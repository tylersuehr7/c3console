; c3console sensor and relay board — ESP32-S3 DevKitC-1 (spec §2, §3.3, §4).
;
;   pio run                 build
;   pio run -t upload       flash over USB
;   pio device monitor      logs on UART0 at 115200 (telemetry leaves on UART1, see include/pins.hpp)
;
; The shared logic lives in lib/c3fw and is unit-tested on the host by the top-level CMake
; build; this project adds the Arduino hardware layer around it.
[env:esp32-s3-devkitc-1]
; pioarduino's platform ships Arduino core 3.x on ESP-IDF 5 with GCC 13, which has the
; C++20 library (<span>, <charconv>) the shared Pi headers use. The registry's
; platformio/espressif32 is still on GCC 8.4 and cannot compile them.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++2a
    -Wall -Wextra -Wshadow
    -I${PROJECT_DIR}/../../src
    -DC3FW_BUILD_STAMP=\"$UNIX_TIME\"
lib_ldf_mode = deep
; The Pi's fault-code and protocol codecs compile into the firmware unchanged: one source of
; truth for the code strings, the CRC and the command channel keys.
build_src_filter =
    +<*>
    +<../../../src/telemetry/fault_codes.cpp>
    +<../../../src/telemetry/protocol.cpp>
